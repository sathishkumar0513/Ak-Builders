# AK Builders Management System — production-style stack
#   docker compose up -d --build          → app on http://localhost
#   docker compose --profile worker up -d → also start Celery (payment reminders)
name: arbuilders

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arbuilders}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-arbuilders}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default. Uncomment to connect pgAdmin on port 5433:
    # ports: ["5433:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["worker"]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      WEB_CONCURRENCY: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  celery:
    build: ./backend
    restart: unless-stopped
    profiles: ["worker"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
    command: celery -A config worker -B -l info
    depends_on: [db, redis]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on: [backend]
    volumes:
      - media:/var/www/media:ro
      - static:/var/www/static:ro

volumes:
  pgdata:
  media:
  static:
